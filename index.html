<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contadores</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }

    .cards {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: #fff;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: 420px;
      text-align: center;
    }

    .card h1 {
      margin-bottom: 10px;
      color: #1f2937;
    }

    .card p {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .box {
      background: #111827;
      color: #fff;
      padding: 18px 8px;
      border-radius: 12px;
    }

    .box span {
      display: block;
      font-size: 28px;
      font-weight: bold;
    }

    .box small {
      font-size: 12px;
      color: #d1d5db;
    }

    .progress-area {
      width: 100%;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      height: 12px;
      margin-bottom: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #2563eb;
      transition: width 0.5s ease;
    }

    .status {
      font-size: 14px;
      color: #374151;
      font-weight: bold;
    }

    .finalizado {
      color: #dc2626;
      font-size: 22px;
      font-weight: bold;
    }


    .time {
      width: 120px;
      display: grid;
      gap: 8px;
      justify-items: center;
      color: #1f2937;
      font-weight: bold;
      font-size: 14px;
    }

  </style>
</head>
<body>

  <div class="cards">
    <div class="card" data-inicio="2026-05-01T00:00:00" data-final="2026-09-01T00:00:00">
      <h1>Timer ate as Ferias</h1>
      <h3>1 DE SETEMBRO DE 2026</h3>
      <p>Tempo restante ate as minhas Ferias</p>

      <div class="timer">
        <div class="box">
          <span data-campo="dias">00</span>
          <small>Dias</small>
        </div>

        <div class="box">
          <span data-campo="horas">00</span>
          <small>Horas</small>
        </div>

        <div class="box">
          <span data-campo="minutos">00</span>
          <small>Minutos</small>
        </div>

        <div class="box">
          <span data-campo="segundos">00</span>
          <small>Segundos</small>
        </div>
      </div>

      <div class="progress-area">
        <div class="progress-bar"></div>
      </div>

      <div class="status">Calculando...</div>
    </div>

    

  <script>
    

    function formatarDataApi(data) {
      const ano = data.getFullYear();
      const mes = formatarNumero(data.getMonth() + 1);
      const dia = formatarNumero(data.getDate());

      return "" + ano + mes + dia;
    }

    function listarDatasBusca() {
      const datas = [];
      const data = new Date();
      const dataFinal = new Date("2026-07-19T23:59:59");

      data.setHours(0, 0, 0, 0);

      while (data <= dataFinal) {
        datas.push(formatarDataApi(data));
        data.setDate(data.getDate() + 1);
      }

      return datas;
    }

    async function buscarJsonComTimeout(url, tempoLimite) {
      const controle = new AbortController();
      const timeout = setTimeout(function() {
        controle.abort();
      }, tempoLimite);

      try {
        const resposta = await fetch(url, { signal: controle.signal });

        if (!resposta.ok) {
          throw new Error("Erro ao buscar placar");
        }

        return await resposta.json();
      } finally {
        clearTimeout(timeout);
      }
    }

    async function buscarEventosEspn() {
      const eventosPorId = {};
      const datas = listarDatasBusca();
      const requisicoes = datas.map(function(data) {
        return buscarJsonComTimeout(ESPN_SCOREBOARD_URL + "?dates=" + data, 8000);
      });

      const respostas = await Promise.allSettled([
        buscarJsonComTimeout(ESPN_SCOREBOARD_URL, 8000)
      ].concat(requisicoes));

      respostas.forEach(function(resposta) {
        if (resposta.status !== "fulfilled") {
          return;
        }

        (resposta.value.events || []).forEach(function(evento) {
          eventosPorId[evento.id] = evento;
        });
      });

      return Object.values(eventosPorId);
    }

    function obterCompetidores(evento) {
      return evento.competitions && evento.competitions[0] && evento.competitions[0].competitors
        ? evento.competitions[0].competitors
        : [];
    }

    function obterTime(competidor) {
      return competidor && competidor.team ? competidor.team : {};
    }

    function timeEhBrasil(competidor) {
      const time = obterTime(competidor);
      return BRASIL_SIGLAS.indexOf(time.abbreviation) !== -1 || normalizarNomeTime(time.displayName) === "brazil";
    }

    function montarDataJogo(evento) {
      const competicao = evento.competitions && evento.competitions[0] ? evento.competitions[0] : {};
      return new Date(evento.date || competicao.date || competicao.startDate);
    }

    function formatarDataJogo(data) {
      const dataFormatada = data.toLocaleDateString("pt-BR", {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
      });
      const horaFormatada = data.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit"
      });

      return dataFormatada + " - " + horaFormatada;
    }

    function aplicarDadosJogoBrasil(evento) {
      const card = document.getElementById("card-brasil");
      const competidores = obterCompetidores(evento);
      const brasil = competidores.find(timeEhBrasil);
      const adversario = competidores.find(function(competidor) {
        return !timeEhBrasil(competidor);
      });
      const timeBrasil = obterTime(brasil);
      const timeAdversario = obterTime(adversario);
      const dataJogo = montarDataJogo(evento);
      const nomeAdversarioApi = timeAdversario.displayName || timeAdversario.shortDisplayName || timeAdversario.name || "";
      const nomeAdversario = adversarioEstaIndefinido(nomeAdversarioApi) ? "A definir" : nomeAdversarioApi;
      const logoAdversario = timeAdversario.logo || "";

      card.dataset.final = dataJogo.toISOString();
      card.dataset.aguardandoApi = "0";
      card.querySelector("[data-jogo-data]").innerText = formatarDataJogo(dataJogo);

      if (timeBrasil.logo) {
        card.querySelector("[data-brasil-logo]").src = timeBrasil.logo;
      }

      card.querySelector("[data-adversario-nome]").innerText = nomeAdversario;

      if (logoAdversario && !adversarioEstaIndefinido(nomeAdversario)) {
        card.querySelector("[data-adversario-placeholder]").style.display = "none";
        const imgAdversario = card.querySelector("[data-adversario-logo]");
        imgAdversario.src = logoAdversario;
        imgAdversario.alt = "Bandeira de " + nomeAdversario;
        imgAdversario.style.display = "block";
      }

      atualizarTimer(card);
    }

    async function carregarJogoBrasil() {
      const card = document.getElementById("card-brasil");

      try {
        const jogos = await buscarEventosEspn();
        const agora = new Date();
        const proximoJogo = jogos
          .filter(function(evento) {
            return obterCompetidores(evento).some(timeEhBrasil) && montarDataJogo(evento) >= agora;
          })
          .sort(function(a, b) {
            return montarDataJogo(a) - montarDataJogo(b);
          })[0];

        if (!proximoJogo) {
          card.querySelector("[data-jogo-data]").innerText = "Nenhum jogo futuro encontrado";
          card.querySelector(".status").innerText = "Sem jogo futuro na ESPN";
          return;
        }

        aplicarDadosJogoBrasil(proximoJogo);
      } catch (erro) {
        card.querySelector("[data-jogo-data]").innerText = "Nao foi possivel carregar o jogo";
        card.querySelector(".status").innerText = "Verifique a API da ESPN";
      }
    }

    function atualizarTimer(card) {
      if (card.dataset.aguardandoApi === "1") {
        return;
      }

      const dataInicio = new Date(card.dataset.inicio);
      const dataFinal = new Date(card.dataset.final);
      const agora = new Date();
      const diferenca = dataFinal - agora;
      const timer = card.querySelector(".timer");
      const progressBar = card.querySelector(".progress-bar");
      const status = card.querySelector(".status");

      if (diferenca <= 0) {
        timer.innerHTML = '<div class="finalizado">Tempo esgotado!</div>';
        progressBar.style.width = "100%";
        status.innerText = "Evento finalizado";
        return;
      }

      const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
      const horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
      const minutos = Math.floor((diferenca / (1000 * 60)) % 60);
      const segundos = Math.floor((diferenca / 1000) % 60);

      card.querySelector('[data-campo="dias"]').innerText = formatarNumero(dias);
      card.querySelector('[data-campo="horas"]').innerText = formatarNumero(horas);
      card.querySelector('[data-campo="minutos"]').innerText = formatarNumero(minutos);
      card.querySelector('[data-campo="segundos"]').innerText = formatarNumero(segundos);

      const total = dataFinal - dataInicio;
      const passado = agora - dataInicio;
      let progresso = (passado / total) * 100;

      progresso = Math.min(Math.max(progresso, 0), 100);

      progressBar.style.width = progresso + "%";
      status.innerText = progresso.toFixed(1) + "% do tempo ja passou";
    }

    function atualizarTimers() {
      document.querySelectorAll(".card").forEach(atualizarTimer);
    }

    atualizarTimers();
    carregarJogoBrasil();
    setInterval(atualizarTimers, 1000);
  </script>

</body>
</html>
