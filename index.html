<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contador até as Férias</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #fff;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: 420px;
      text-align: center;
    }

    .card h1 {
      margin-bottom: 10px;
      color: #1f2937;
    }

    .card p {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .box {
      background: #111827;
      color: #fff;
      padding: 18px 8px;
      border-radius: 12px;
    }

    .box span {
      display: block;
      font-size: 28px;
      font-weight: bold;
    }

    .box small {
      font-size: 12px;
      color: #d1d5db;
    }

    .progress-area {
      width: 100%;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      height: 12px;
      margin-bottom: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #2563eb;
      transition: width 0.5s ease;
    }

    .status {
      font-size: 14px;
      color: #374151;
      font-weight: bold;
    }

    .finalizado {
      color: #dc2626;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Timer até as Férias</h1>
    <h3>1 DE SETEMBRO DE 2026</h3>
    <p>Tempo restante até as minhas Férias</p>

    <div id="timer" class="timer">
      <div class="box">
        <span id="dias">00</span>
        <small>Dias</small>
      </div>

      <div class="box">
        <span id="horas">00</span>
        <small>Horas</small>
      </div>

      <div class="box">
        <span id="minutos">00</span>
        <small>Minutos</small>
      </div>

      <div class="box">
        <span id="segundos">00</span>
        <small>Segundos</small>
      </div>
    </div>

    <div class="progress-area">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="status" class="status">Calculando...</div>
  </div>

  <script>
    const dataInicio = new Date("2026-05-01T00:00:00");
    const dataFinal = new Date("2026-09-01T00:00:00");

    function formatarNumero(numero) {
      return numero < 10 ? "0" + numero : numero;
    }

    function atualizarTimer() {
      const agora = new Date();
      const diferenca = dataFinal - agora;

      if (diferenca <= 0) {
        document.getElementById("timer").innerHTML =
          '<div class="finalizado">Tempo esgotado!</div>';

        document.getElementById("progressBar").style.width = "100%";
        document.getElementById("status").innerText = "Evento finalizado";
        return;
      }

      const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
      const horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
      const minutos = Math.floor((diferenca / (1000 * 60)) % 60);
      const segundos = Math.floor((diferenca / 1000) % 60);

      document.getElementById("dias").innerText = formatarNumero(dias);
      document.getElementById("horas").innerText = formatarNumero(horas);
      document.getElementById("minutos").innerText = formatarNumero(minutos);
      document.getElementById("segundos").innerText = formatarNumero(segundos);

      const total = dataFinal - dataInicio;
      const passado = agora - dataInicio;
      let progresso = (passado / total) * 100;

      progresso = Math.min(Math.max(progresso, 0), 100);

      document.getElementById("progressBar").style.width = progresso + "%";
      document.getElementById("status").innerText =
        progresso.toFixed(1) + "% do tempo já passou";
    }

    atualizarTimer();
    setInterval(atualizarTimer, 1000);
  </script>

</body>
</html>
